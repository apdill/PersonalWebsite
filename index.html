<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Aiden Dillon's research as a connected tree of fractals, neurons, computer vision, and creative experiments.">
  <meta name="theme-color" content="#ffeadb">
  <link rel="icon" type="image/svg+xml" href="fork.svg">
  <link rel="canonical" href="https://apdill.com/">
  <title>Aiden Dillon — Research & Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tree.css?v=retinal-junction">
  <script src="halftone.js?v=shaded-fork" defer></script>
  <script src="fractal-slider.js" defer></script>
  <script src="tree.js?v=paper-canopy" defer></script>
</head>
<body>
  <a class="skip-link" href="#map-tools">Skip to tree navigation</a>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Aiden Dillon, tree home"><span>Aiden Dillon<span class="wordmark-sub">PHYSICS PH.D. CANDIDATE</span></span></a>
    <div class="header-note">University of Oregon</div>
    <a class="contact-link" href="mailto:aidend@uoregon.edu">Contact <span aria-hidden="true">↗</span></a>
  </header>

  <main>
    <div class="map-shell">
      <div class="introduction">
        <p class="eyebrow">RESEARCH & PROJECTS</p>
        <h1>Fractals, neurons, and machine vision.</h1>
        <button class="text-button" id="start-roots">About me <span aria-hidden="true">↘</span></button>
      </div>

      <div class="map-viewport" id="map" role="region" aria-label="Interactive tree of research projects and background" aria-describedby="map-help" tabindex="0">
        <div class="tree-scene" id="tree-scene">
          <svg class="tree-drawing" viewBox="0 0 1440 1020" aria-hidden="true">
            <defs>
              <linearGradient id="trunk-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#647c54"/><stop offset="1" stop-color="#8d7957"/></linearGradient>
              <linearGradient id="earth-wash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7dfc9" stop-opacity=".32"/><stop offset="1" stop-color="#eee7d8" stop-opacity="0"/></linearGradient>
            </defs>
            <path class="earth-wash" d="M30 758 Q260 754 435 761 T720 758 T1100 760 T1410 757 V1020 H30Z" fill="url(#earth-wash)"/>
            <path class="ground" d="M30 758 Q260 754 435 761 T720 758 T1100 760 T1410 757"/>
            <g id="fine-branches"></g>
            <g class="trunk-group"><path class="trunk" d="M720 765 C705 712 692 676 707 626 C720 582 745 554 729 506 C719 475 708 456 717 423"/><path class="trunk-thread" d="M722 759 C722 704 704 679 716 634 C730 583 751 548 738 510"/></g>
            <g id="branch-paths"></g>
            <g id="root-paths"></g>
            <g id="tip-paths"></g>
            <g id="growth-marks"></g>
          </svg>
          <div id="tree-nodes"></div>
        </div>
      </div>

      <div class="map-toolbar" id="map-tools" tabindex="-1">
        <div class="view-tools" aria-label="Tree view controls">
          <button id="zoom-out" aria-label="Zoom out">−</button>
          <button id="reset-view" title="Show the whole tree">Whole tree</button>
          <button id="zoom-in" aria-label="Zoom in">+</button>
        </div>
        <label class="jump-label"><span class="sr-only">Jump to a branch or root</span><select id="jump"><option value="">Find a branch…</option></select></label>
        <button class="index-button" id="open-index">Index <span aria-hidden="true">☷</span></button>
      </div>
      <p class="sr-only" id="map-help">Select a node to read more. Drag to pan. + / − to zoom.</p>
      <p class="sr-only" id="map-status" role="status" aria-live="polite"></p>
    </div>
    <noscript><p class="no-script">The interactive tree needs JavaScript. <a href="classic.html">Read the full portfolio here.</a></p></noscript>
  </main>

  <footer class="site-footer"><span>© 2026 AIDEN DILLON</span><a href="classic.html">Classic view <span aria-hidden="true">↗</span></a></footer>

  <dialog class="detail-panel" id="detail" aria-labelledby="detail-title">
    <div class="panel-top"><span class="eyebrow" id="panel-kind">PROJECT NOTES</span><button id="close-detail" class="close-button" aria-label="Close project notes">×</button></div>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
